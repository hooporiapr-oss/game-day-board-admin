<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gostar Digital · License Admin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#0a0a0f;color:#e8eef5;min-height:100vh;padding:24px}
  .wrap{max-width:1100px;margin:0 auto}

  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px}
  .brand .kick{font-size:.62rem;font-weight:900;letter-spacing:.34em;text-transform:uppercase;color:#ff1e3c}
  .brand .name{font-size:1.8rem;font-weight:900;font-style:italic;letter-spacing:.03em;text-transform:uppercase;color:#fff;line-height:1}
  .brand .sub{font-size:.64rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#8892a0;margin-top:2px}
  .signout{padding:8px 16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#e8eef5;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer}

  /* login */
  #login{max-width:380px;margin:80px auto 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,30,60,.25);border-radius:14px;padding:32px}
  #login h2{font-size:.8rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#ff1e3c;text-align:center;margin-bottom:20px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8892a0;margin-bottom:6px}
  .fld input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:1rem}
  .btn{width:100%;padding:13px;border:none;border-radius:8px;background:linear-gradient(135deg,#ff1e3c,#c8102e);color:#fff;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-size:.9rem}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,30,60,.3)}
  .msg{text-align:center;font-size:.82rem;margin-top:12px;min-height:18px}
  .msg.bad{color:#ff8888}.msg.ok{color:#00d9a5}

  /* dashboard */
  #dash{display:none}
  .prod-tabs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .prod-tab{padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#8892a0;font-weight:800;font-size:.82rem;cursor:pointer;letter-spacing:.02em}
  .prod-tab.active{background:rgba(255,30,60,.16);border-color:rgba(255,30,60,.5);color:#fff}
  .prod-tab.legacy{opacity:.55;font-size:.74rem}
  .prod-note{font-size:.72rem;color:#7d8798;margin-bottom:18px;line-height:1.5}
  .prod-note b{color:#a8b3c4}
  #add-product-label,#list-product-label{color:#8892a0;font-weight:700;text-transform:none;letter-spacing:0;font-size:.85rem}
  .add-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px 20px;margin-bottom:22px}

  .add-title{font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#8892a0;margin-bottom:14px}
  .add-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .af{display:flex;flex-direction:column;gap:5px}
  .af label{font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#8892a0}
  .af input{padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.92);color:#222;font-size:.95rem;font-weight:600}
  .af input#a-code{width:200px;text-transform:uppercase}
  .af input#a-school{width:220px}
  .add-btn{padding:11px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,#00d9a5,#00a884);color:#062;font-weight:900;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;font-size:.85rem}
  .year-btn{padding:11px 14px;border:1px solid rgba(0,140,255,.35);border-radius:8px;background:rgba(0,140,255,.12);color:#4db8ff;font-weight:800;cursor:pointer;font-size:.78rem}

  .list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .list-title{font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#8892a0}
  .refresh{background:none;border:1px solid rgba(255,255,255,.15);color:#8892a0;border-radius:8px;padding:6px 12px;font-size:.72rem;font-weight:700;cursor:pointer}

  table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.02);border-radius:12px;overflow:hidden}
  th{text-align:left;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#ff8896;padding:12px 14px;background:rgba(255,30,60,.1)}
  td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem}
  tr:hover td{background:rgba(255,255,255,.02)}
  .code-cell{font-family:'Courier New',monospace;font-weight:900;color:#fff}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
  .pill.active{background:rgba(0,217,165,.18);color:#00d9a5}
  .pill.inactive{background:rgba(255,107,107,.18);color:#ff8888}
  .pill.expired{background:rgba(255,180,80,.18);color:#ffb450}
  .pill.sold{background:rgba(124,58,237,.2);color:#c4b5fd;margin-left:6px}
  .exp-soon{color:#ffb450;font-weight:700}
  .exp-never{color:#ffb450}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .mini{padding:5px 10px;border-radius:6px;font-size:.7rem;font-weight:800;cursor:pointer;border:1px solid transparent}
  .mini.renew{background:rgba(0,140,255,.15);border-color:rgba(0,140,255,.3);color:#4db8ff}
  .mini.toggle{background:rgba(255,180,80,.15);border-color:rgba(255,180,80,.3);color:#ffb450}
  .mini.del{background:rgba(255,60,60,.15);border-color:rgba(255,60,60,.3);color:#ff6b6b}
  .empty{text-align:center;color:#5a6070;padding:30px}
  .count{font-size:.7rem;color:#8892a0}

  .standings-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px 20px;margin-top:22px}
  .standings-card.hidden{display:none}
  .standings-title{font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#8892a0;margin-bottom:14px}
  .standings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .standings-row:last-child{border-bottom:none}
  .standings-game-name{font-size:.92rem;font-weight:700;color:#fff}
  .standings-reset-btn{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,60,60,.3);background:rgba(255,60,60,.12);color:#ff6b6b;font-size:.75rem;font-weight:800;cursor:pointer}
  .standings-confirm{display:none;margin-top:10px;padding:14px;border:1px solid rgba(255,30,60,.4);background:rgba(255,30,60,.06);border-radius:10px}
  .standings-confirm.show{display:block}
  .standings-confirm-text{font-size:.8rem;color:#ff8fa3;font-weight:700;margin-bottom:10px}
  .standings-confirm-actions{display:flex;gap:8px}
  .standings-confirm-actions button{padding:8px 14px;border-radius:8px;font-size:.72rem;font-weight:800;cursor:pointer}
  .standings-cancel-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff}
  .standings-yes-btn{border:none;background:#ff1e3c;color:#fff}
  .standings-msg{font-size:.72rem;margin-top:8px;min-height:16px}
  .standings-msg.ok{color:#00d9a5}.standings-msg.bad{color:#ff8888}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="kick">⚡ Gostar Digital</div>
      <div class="name">License Admin</div>
      <div class="sub">Manage School Access</div>
    </div>
    <button class="signout" id="signout-btn" onclick="signOut()" style="display:none">Sign Out</button>
  </div>

  <!-- LOGIN -->
  <div id="login">
    <h2>🔒 Admin Login</h2>
    <div class="fld"><label>Email</label><input id="l-email" type="email" placeholder="you@email.com" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="fld"><label>Password</label><input id="l-pass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn" onclick="login()">Sign In</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash">
    <div class="prod-tabs">
      <button class="prod-tab active" id="tab-hooporia" onclick="switchProduct('hooporia')">🎯 Dynamic Memory</button>
      <button class="prod-tab" id="tab-fortress-mobile" onclick="switchProduct('fortress-mobile')">🧩 Fortress Mobile</button>
      <button class="prod-tab legacy" id="tab-ritnome" onclick="switchProduct('ritnome')">Retired · Ritnome</button>
      <button class="prod-tab legacy" id="tab-hooporia-standings" onclick="switchProduct('hooporia-standings')">Retired · Memory Standings</button>
      <button class="prod-tab legacy" id="tab-ritnome-standings" onclick="switchProduct('ritnome-standings')">Retired · Ritnome Standings</button>
    </div>
    <div class="prod-note" id="prod-note"></div>

    <div id="license-sections">
      <div class="add-card">
        <div class="add-title">➕ Add a License <span id="add-product-label"></span></div>
        <div class="add-row">
          <div class="af"><label>Code</label><input id="a-code" placeholder="LINCOLN-PREP-2026" maxlength="40"></div>
          <div class="af"><label>School Name</label><input id="a-school" placeholder="Lincoln Prep Academy" maxlength="60"></div>
          <div class="af"><label>Expires</label><input id="a-expires" type="date"></div>
          <div class="af"><label>&nbsp;</label><button class="year-btn" onclick="setOneYear()">+1 year</button></div>
          <div class="af"><label>Notes (optional)</label><input id="a-notes" placeholder="e.g. 30-day trial, comp, paid annual" maxlength="80"></div>
          <button class="add-btn" onclick="addLicense()">+ Add</button>
        </div>
        <div class="msg" id="add-msg"></div>
      </div>

      <div class="list-head">
        <div class="list-title">Licensed Schools <span id="list-product-label"></span> <span class="count" id="count"></span></div>
        <button class="refresh" onclick="loadLicenses()">↻ Refresh</button>
      </div>

      <table>
        <thead>
          <tr><th>Code</th><th>School</th><th>Expires</th><th>Status</th><th>Notes</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="standings-card hidden" id="standings-card">
      <div class="standings-title">🏆 Standings — Reset a Shared Board</div>
      <div class="standings-school-picker" id="standings-school-picker" style="margin-bottom:16px">
        <label for="standings-school-select" style="display:block;font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8892a0;margin-bottom:6px">Reset scope</label>
        <select id="standings-school-select" onchange="renderStandingsSection(currentProduct)" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);color:#fff;font-size:.85rem"></select>
      </div>
      <div id="standings-list"></div>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════
//  This admin panel talks to Supabase directly over fetch(),
//  the same proven approach the gate pages already use.
//
//  PRODUCT SCOPES, after the merge:
//
//    hooporia        — Dynamic Memory. One code now opens the
//                      memory games, Ritnome, and both standings
//                      boards. This is the product sold through
//                      Basketball Money, and the one to issue for
//                      trials and comps.
//    fortress-mobile — The Fortress Mobile. Still its own separate
//                      site with its own separate gate.
//
//  The three "Retired" tabs are the old, pre-merge scopes. Their
//  gates no longer exist, so a NEW code issued under them would
//  unlock nothing. They stay visible only so existing rows can
//  still be seen and revoked — adding is blocked there on purpose.
// ══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
// ══════════════════════════════════════════════════════

var $ = function(id){ return document.getElementById(id); };
var currentProduct = 'hooporia';
var editingId = null;
var lastLicenseRows = [];
var lastLicenseTbody = null;
var accessToken = null, refreshToken = null;

var PRODUCTS = {
  'hooporia': {
    label: '(Dynamic Memory)',
    retired: false,
    note: 'One code opens the memory games, Ritnome and both standings boards. This is what Basketball Money sells, and what to issue for trials and comps.'
  },
  'fortress-mobile': {
    label: '(Fortress Mobile)',
    retired: false,
    note: 'Separate site, separate gate. A device stays unlocked once a code is entered, so an expiry here will not lock a device that already got in.'
  },
  'ritnome': {
    label: '(Ritnome — retired)',
    retired: true,
    note: 'Retired. Ritnome is now part of Dynamic Memory and its own gate is gone, so a new code here would unlock nothing. Existing rows are shown so they can be revoked.'
  },
  'hooporia-standings': {
    label: '(Memory Standings — retired)',
    retired: true,
    note: 'Retired. Standings no longer has a separate gate — a Dynamic Memory code opens it. Existing rows are shown so they can be revoked.'
  },
  'ritnome-standings': {
    label: '(Ritnome Standings — retired)',
    retired: true,
    note: 'Retired. Standings no longer has a separate gate — a Dynamic Memory code opens it. Existing rows are shown so they can be revoked.'
  }
};

function saveSession(at, rt){
  accessToken = at; refreshToken = rt;
  try{ localStorage.setItem('admin-at', at); localStorage.setItem('admin-rt', rt); }catch(e){}
}
function clearSession(){
  accessToken = null; refreshToken = null;
  try{ localStorage.removeItem('admin-at'); localStorage.removeItem('admin-rt'); }catch(e){}
}

function authHeaders(){
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + (accessToken || SUPABASE_ANON_KEY),
    'Content-Type': 'application/json'
  };
}

// ── auth ──
async function checkSession(){
  try{ accessToken = localStorage.getItem('admin-at'); refreshToken = localStorage.getItem('admin-rt'); }catch(e){}
  if (!accessToken){ showLogin(); return; }
  var ok = await tryRequest(SUPABASE_URL + '/rest/v1/licenses?select=id&limit=1');
  if (ok) { showDash(); return; }
  if (refreshToken && await doRefresh()) { showDash(); return; }
  clearSession();
  showLogin();
}

async function tryRequest(url){
  try{
    var r = await fetch(url, { headers: authHeaders() });
    return r.ok;
  }catch(e){ return false; }
}

async function doRefresh(){
  try{
    var r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken })
    });
    if (!r.ok) return false;
    var data = await r.json();
    if (!data.access_token) return false;
    saveSession(data.access_token, data.refresh_token);
    return true;
  }catch(e){ return false; }
}

function showLogin(){ $('login').style.display='block'; $('dash').style.display='none'; $('signout-btn').style.display='none'; }
function showDash(){ $('login').style.display='none'; $('dash').style.display='block'; $('signout-btn').style.display='inline-block'; switchProduct(currentProduct); }

window.login = async function(){
  var email = $('l-email').value.trim();
  var password = $('l-pass').value;
  if (!email || !password){ $('login-msg').className='msg bad'; $('login-msg').textContent='Enter your email and password'; return; }
  $('login-msg').className='msg'; $('login-msg').textContent='Signing in…';
  try{
    var r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    var data = await r.json();
    if (!r.ok || !data.access_token){
      $('login-msg').className='msg bad';
      $('login-msg').textContent = data.error_description || data.msg || 'Invalid email or password';
      return;
    }
    saveSession(data.access_token, data.refresh_token);
    $('login-msg').textContent='';
    showDash();
  }catch(e){
    $('login-msg').className='msg bad';
    $('login-msg').textContent='Connection problem — please try again';
  }
};

window.signOut = async function(){
  try{ await fetch(SUPABASE_URL + '/auth/v1/logout', { method:'POST', headers: authHeaders() }); }catch(e){}
  clearSession();
  showLogin();
};

window.switchProduct = function(product){
  currentProduct = product;
  Object.keys(PRODUCTS).forEach(function(p){
    var el = $('tab-' + p);
    if (!el) return;
    el.className = 'prod-tab' + (PRODUCTS[p].retired ? ' legacy' : '') + (p === product ? ' active' : '');
  });

  var cfg = PRODUCTS[product] || { label:'', retired:false, note:'' };
  $('add-product-label').textContent = cfg.label;
  $('list-product-label').textContent = cfg.label;
  $('prod-note').innerHTML = cfg.note;

  // Adding under a retired scope would produce a code that opens
  // nothing, so the form is closed off rather than left as a trap.
  var addCard = document.querySelector('.add-card');
  if (addCard) addCard.style.display = cfg.retired ? 'none' : 'block';

  loadLicenses();
  renderStandingsSection(product);
};

// Expiry is now the norm rather than the exception — a license is
// one year, so this fills the date without any counting.
window.setOneYear = function(){
  var d = new Date(); d.setFullYear(d.getFullYear() + 1);
  $('a-expires').value = d.toISOString().slice(0,10);
};

// ── standings reset ──
var STANDINGS_BY_PRODUCT = {
  'hooporia': [
    { name: 'The Fortress', table: 'dynamic_memory_quarter_standings', gameKey: 'fortress' },
    { name: 'Recall', table: 'dynamic_memory_quarter_standings', gameKey: 'recall' },
    { name: 'Recognition', table: 'dynamic_memory_quarter_standings', gameKey: 'recognition' },
    { name: 'Ritnome (all patterns)', table: 'ritnome_standings' }
  ],
  'fortress-mobile': [
    { name: 'The Fortress (Mobile)', table: 'ritnome_mobile_fortress_standings' }
  ]
};

function renderStandingsSection(product){
  var games = STANDINGS_BY_PRODUCT[product];
  var card = $('standings-card');
  if(!games){
    card.className = 'standings-card hidden';
    return;
  }
  card.className = 'standings-card';

  var selectEl = $('standings-school-select');
  var previousSelection = selectEl.value;
  var schoolNames = [];
  (lastLicenseRows||[]).forEach(function(r){
    if(r.school_name && schoolNames.indexOf(r.school_name)===-1) schoolNames.push(r.school_name);
  });
  schoolNames.sort();
  selectEl.innerHTML = '<option value="">All Schools (every access code)</option>'
    + schoolNames.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>'}).join('');
  if(schoolNames.indexOf(previousSelection)!==-1) selectEl.value = previousSelection;
  var selectedSchool = selectEl.value;

  $('standings-list').innerHTML = games.map(function(g){
    var safeId = g.gameKey ? (g.table + '-' + g.gameKey) : g.table;
    var scopeLabel = selectedSchool ? (' at ' + selectedSchool) : ' — every school';
    return '<div class="standings-row">'
      + '<span class="standings-game-name">' + g.name + '</span>'
      + '<button class="standings-reset-btn" id="reset-btn-' + safeId + '" onclick="offerStandingsReset(\'' + safeId + '\')">Reset</button>'
      + '</div>'
      + '<div class="standings-confirm" id="reset-confirm-' + safeId + '">'
      + '  <div class="standings-confirm-text">Clear all standings for ' + g.name + scopeLabel + '? Every matching player\'s score is permanently removed. This can\'t be undone.</div>'
      + '  <div class="standings-confirm-actions">'
      + '    <button class="standings-cancel-btn" onclick="cancelStandingsReset(\'' + safeId + '\')">Cancel</button>'
      + '    <button class="standings-yes-btn" onclick="confirmStandingsReset(\'' + safeId + '\',\'' + g.name.replace(/'/g,"\\'") + '\',\'' + g.table + '\',' + (g.gameKey ? ("'"+g.gameKey+"'") : 'null') + ')">Yes, Reset</button>'
      + '  </div>'
      + '  <div class="standings-msg" id="reset-msg-' + safeId + '"></div>'
      + '</div>';
  }).join('');
}

window.offerStandingsReset = function(table){
  $('reset-confirm-' + table).className = 'standings-confirm show';
};
window.cancelStandingsReset = function(table){
  $('reset-confirm-' + table).className = 'standings-confirm';
  $('reset-msg-' + table).textContent = '';
};
window.confirmStandingsReset = async function(safeId, gameName, actualTable, gameKey){
  var msgEl = $('reset-msg-' + safeId);
  msgEl.className = 'standings-msg';
  msgEl.textContent = 'Clearing…';
  try{
    // A merely-successful HTTP status here does NOT prove anything
    // was actually deleted — asking for the deleted rows back
    // (Prefer: return=representation) is what lets this tell the
    // difference between "cleared" and "silently did nothing".
    var selectedSchool = $('standings-school-select').value;
    var scopeParts = [];
    scopeParts.push(selectedSchool ? ('school_name=eq.'+encodeURIComponent(selectedSchool)) : 'id=gt.0');
    if(gameKey) scopeParts.push('game_key=eq.'+encodeURIComponent(gameKey));
    var scopeQuery = scopeParts.join('&');
    var headers = authHeaders();
    headers['Prefer'] = 'return=representation';
    var r = await fetch(SUPABASE_URL + '/rest/v1/' + actualTable + '?' + scopeQuery, {
      method: 'DELETE',
      headers: headers
    });
    if(!r.ok){
      msgEl.className = 'standings-msg bad';
      msgEl.textContent = 'Something went wrong — please try again';
      return;
    }
    var deletedRows = [];
    try{ deletedRows = await r.json(); }catch(e){}
    msgEl.className = 'standings-msg ok';
    msgEl.textContent = gameName + '\'s standings cleared (' + deletedRows.length + ' entries removed).';
    setTimeout(function(){
      $('reset-confirm-' + safeId).className = 'standings-confirm';
      msgEl.textContent = '';
    }, 2500);
  }catch(e){
    msgEl.className = 'standings-msg bad';
    msgEl.textContent = 'Connection problem — please try again';
  }
};

// ── licenses ──
window.loadLicenses = async function(){
  var tbody = $('rows');
  tbody.innerHTML = '<tr><td colspan="6" class="empty">Loading…</td></tr>';
  try{
    var url = SUPABASE_URL + '/rest/v1/licenses?select=*&product=eq.' + encodeURIComponent(currentProduct);
    var r = await fetch(url, { headers: authHeaders() });
    if (!r.ok){
      var errBody = await r.json().catch(function(){ return {}; });
      tbody.innerHTML = '<tr><td colspan="6" class="empty">Error: '+esc(errBody.message||r.statusText)+'</td></tr>';
      return;
    }
    var data = await r.json();
    var rows = (data || []).slice().sort(function(a,b){
      if (!a.expires_at && !b.expires_at) return 0;
      if (!a.expires_at) return 1;
      if (!b.expires_at) return -1;
      return a.expires_at < b.expires_at ? -1 : 1;
    });
    if (!rows.length){ tbody.innerHTML='<tr><td colspan="6" class="empty">No licenses under this product yet.</td></tr>'; $('count').textContent=''; renderStandingsSection(currentProduct); return; }
    $('count').textContent = '('+rows.length+')';
    renderRows(rows, tbody);
    renderStandingsSection(currentProduct);
  }catch(e){
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Load failed: '+esc(e.message)+'</td></tr>';
  }
};

function renderRows(data, tbody){
  lastLicenseRows = data;
  lastLicenseTbody = tbody;
  var today = new Date();
  tbody.innerHTML = data.map(function(r){
    var statusPill, expText='';
    var expired = r.expires_at && new Date(r.expires_at+'T23:59:59') < today;
    if (!r.active) statusPill = '<span class="pill inactive">Revoked</span>';
    else if (expired) statusPill = '<span class="pill expired">Expired</span>';
    else statusPill = '<span class="pill active">Active</span>';

    // Codes that came from a purchase are marked, so a sold license
    // is never mistaken for one issued by hand.
    var sold = (r.notes || '').indexOf('Purchased through Basketball Money') !== -1;
    if (sold) statusPill += '<span class="pill sold">Sold</span>';

    if (r.expires_at){
      var days = Math.ceil((new Date(r.expires_at+'T23:59:59') - today)/86400000);
      if (days < 0) expText = r.expires_at;
      else if (days <= 30) expText = '<span class="exp-soon">'+r.expires_at+' ('+days+'d)</span>';
      else expText = r.expires_at;
    } else expText = '<span class="exp-never">never</span>';

    if (r.id === editingId){
      return '<tr>'
        + '<td><input id="edit-code-'+r.id+'" value="'+esc(r.code)+'" style="width:100%"></td>'
        + '<td><input id="edit-school-'+r.id+'" value="'+esc(r.school_name||'')+'" style="width:100%"></td>'
        + '<td><input id="edit-expires-'+r.id+'" type="date" value="'+esc(r.expires_at||'')+'" style="width:100%"></td>'
        + '<td>'+statusPill+'</td>'
        + '<td><input id="edit-notes-'+r.id+'" value="'+esc(r.notes||'')+'" style="width:100%"></td>'
        + '<td><div class="row-actions">'
          + '<button class="mini renew" onclick="saveEdit(\''+r.id+'\')">Save</button>'
          + '<button class="mini toggle" onclick="cancelEdit()">Cancel</button>'
        + '</div></td>'
        + '</tr>';
    }

    return '<tr>'
      + '<td class="code-cell">'+esc(r.code)+'</td>'
      + '<td>'+esc(r.school_name||'')+'</td>'
      + '<td>'+expText+'</td>'
      + '<td>'+statusPill+'</td>'
      + '<td style="color:#8892a0;font-size:.82rem">'+esc(r.notes||'')+'</td>'
      + '<td><div class="row-actions">'
        + '<button class="mini toggle" onclick="startEdit(\''+r.id+'\')">Edit</button>'
        + '<button class="mini renew" onclick="renew(\''+r.id+'\')">+1yr</button>'
        + '<button class="mini toggle" onclick="toggle(\''+r.id+'\','+(r.active?'false':'true')+')">'+(r.active?'Revoke':'Enable')+'</button>'
        + '<button class="mini del" onclick="del(\''+r.id+'\',\''+esc(r.code)+'\')">Delete</button>'
      + '</div></td>'
      + '</tr>';
  }).join('');
}

window.addLicense = async function(){
  if ((PRODUCTS[currentProduct]||{}).retired){
    setAddMsg('That product is retired — issue a Dynamic Memory code instead','bad');
    return;
  }
  var code = $('a-code').value.trim().toUpperCase();
  var school = $('a-school').value.trim();
  var expires = $('a-expires').value || null;
  var notes = $('a-notes').value.trim() || null;
  if (!code){ setAddMsg('Enter a code','bad'); return; }
  if (!school){ setAddMsg('Enter a school name','bad'); return; }
  try{
    var r = await fetch(SUPABASE_URL + '/rest/v1/licenses', {
      method: 'POST',
      headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ code: code, school_name: school, expires_at: expires, notes: notes, active: true, product: currentProduct })
    });
    if (!r.ok){
      var errBody = await r.json().catch(function(){ return {}; });
      setAddMsg(errBody.code==='23505' ? 'That code already exists' : (errBody.message || 'Could not add license'), 'bad');
      return;
    }
    $('a-code').value=''; $('a-school').value=''; $('a-expires').value=''; $('a-notes').value='';
    setAddMsg('✓ License added','ok');
    loadLicenses();
  }catch(e){
    setAddMsg('Connection problem — please try again','bad');
  }
};
function setAddMsg(m,c){ $('add-msg').className='msg '+c; $('add-msg').textContent=m; setTimeout(function(){ if($('add-msg').textContent===m) $('add-msg').textContent=''; }, 4000); }

window.startEdit = function(id){
  editingId = id;
  renderRows(lastLicenseRows, lastLicenseTbody);
};

window.cancelEdit = function(){
  editingId = null;
  renderRows(lastLicenseRows, lastLicenseTbody);
};

window.saveEdit = async function(id){
  var code = $('edit-code-'+id).value.trim().toUpperCase();
  var school = $('edit-school-'+id).value.trim();
  var expires = $('edit-expires-'+id).value || null;
  var notes = $('edit-notes-'+id).value.trim() || null;
  if (!code){ alert('Enter a code'); return; }
  if (!school){ alert('Enter a school name'); return; }
  try{
    var r = await fetch(SUPABASE_URL + '/rest/v1/licenses?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ code: code, school_name: school, expires_at: expires, notes: notes })
    });
    if (!r.ok){
      var errBody = await r.json().catch(function(){ return {}; });
      alert(errBody.code==='23505' ? 'That code already exists' : (errBody.message || 'Error saving changes'));
      return;
    }
    editingId = null;
    loadLicenses();
  }catch(e){ alert('Connection problem — please try again'); }
};

window.renew = async function(id){
  var d = new Date(); d.setFullYear(d.getFullYear()+1);
  var newDate = d.toISOString().slice(0,10);
  try{
    var r = await fetch(SUPABASE_URL + '/rest/v1/licenses?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ expires_at: newDate, active: true })
    });
    if (!r.ok){ alert('Error renewing license'); return; }
    loadLicenses();
  }catch(e){ alert('Connection problem — please try again'); }
};

window.toggle = async function(id, makeActive){
  try{
    var r = await fetch(SUPABASE_URL + '/rest/v1/licenses?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ active: makeActive })
    });
    if (!r.ok){ alert('Error updating license'); return; }
    loadLicenses();
  }catch(e){ alert('Connection problem — please try again'); }
};

window.del = async function(id, code){
  if (!confirm('Delete license "'+code+'"? This permanently removes it and locks out that school.')) return;
  try{
    var r = await fetch(SUPABASE_URL + '/rest/v1/licenses?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (!r.ok){ alert('Error deleting license'); return; }
    loadLicenses();
  }catch(e){ alert('Connection problem — please try again'); }
};

function esc(s){ return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]}); }

checkSession();
